<div class="notification-container">
  <button class="notification-button" (click)="toggleDropdown()">
    <i class="fas fa-bell"></i>
    <span *ngIf="notificationService.unreadCount$ | async as count" 
          class="badge" [class.hidden]="count === 0">
      {{ count }}
    </span>
  </button>

  <div class="dropdown" [class.show]="showDropdown" *ngIf="isLoggedIn()">
    <div class="dropdown-header">
      <h4>Notifications</h4>
    </div>
    <div class="dropdown-content">
      <div *ngIf="(notificationService.notifications$ | async)?.length === 0" class="empty">
        No notifications
      </div>
      <div *ngFor="let notif of notificationService.notifications$ | async" 
           class="notification-item" [class.unread]="!notif.isRead">
        <div class="notification-title">{{ notif.title }}</div>
        <div class="notification-message">{{ notif.message }}</div>
        <div class="notification-footer">
          <span class="time">{{ formatDate(notif.createdAt) }}</span>
          <button *ngIf="!notif.isRead" class="mark-read" 
                  (click)="markAsRead(notif.id); $event.stopPropagation()">
            Mark as read
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
