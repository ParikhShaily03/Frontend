<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <img src="https://t4.ftcdn.net/jpg/11/95/02/03/240_F_1195020310_6VRXUyP1TqbI5ssiUQOhFqiQdm7HPqN9.jpg" alt="App Logo" />
      <h2>Login</h2>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label for="userName">Username</label>
        <input id="userName" formControlName="userName" />
        <div *ngIf="form.get('userName')?.invalid && form.get('userName')?.touched">
          Username is required
        </div>
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" />
        <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Password is required
        </div>
      </div>
      <button type="submit" [disabled]="form.invalid">Login</button>
      <div style="text-align: center; margin-top: 5px;">
          <a routerLink="/forgot-password" class="forgot-password-link">
            Forgot Password?
          </a>
        </div>
    </form>
        
  </div>
</div>
