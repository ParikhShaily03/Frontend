<p>forgot-password!</p>
<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Email:</label>
  <input formControlName="email" type="email" />
  <button type="submit">Send OTP</button>
</form>

<p style="color: green" *ngIf="message">{{ message }}</p>
<p style="color: red" *ngIf="error">{{ error }}</p>
