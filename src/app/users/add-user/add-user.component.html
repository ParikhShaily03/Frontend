<div class="container mt-4">
   
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <h2>Add New User</h2>
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input formControlName="name" id="name" class="form-control" />
      </div>
  
      <div class="mb-3">
        <label for="userName" class="form-label">Username</label>
        <input formControlName="userName" id="userName" class="form-control" />
      </div>
  
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input formControlName="email" id="email" type="email" class="form-control" />
      </div>
  
      <div class="mb-3">
        <label for="department" class="form-label">Department</label>
        <input formControlName="department" id="department" class="form-control" />
      </div>
  
      <button type="submit" class="btn btn-success" [disabled]="userForm.invalid">Add User</button>
    </form>
  </div>
